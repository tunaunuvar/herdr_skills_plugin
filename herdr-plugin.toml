id = "tunaunuvar.herdr-skills"
name = "AI Skills"
version = "0.4.2"
min_herdr_version = "0.9.0"
description = "Installed skills and observed session usage in a terminal popup"
platforms = ["windows", "macos", "linux"]

[[panes]]
id = "skills"
title = "AI Skills"
placement = "popup"
width = "90%"
height = "85%"
command = ["node", "skills.js"]

[[actions]]
id = "open"
title = "Open AI skills"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "tunaunuvar.herdr-skills", "--entrypoint", "skills", "--placement", "popup", "--width", "90%", "--height", "85%"]
